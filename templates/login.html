<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · SmartSchedule</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}?v=120"></head>
<body class="loginbody"><div class="loginwrap"><div class="loginbrand"><span class="mark">S</span><div><b>SmartSchedule</b><small>Умное школьное расписание</small></div></div>
<div class="card login-card"><div class="eyebrow">ДОБРО ПОЖАЛОВАТЬ</div><h1>Кто вы?</h1><p class="muted">Выберите режим работы перед входом в школьную систему.</p>
{% if error %}<div class="warning">{{error}}</div>{% endif %}
<div class="role-grid">
<form method="post"><input type="hidden" name="role" value="composer"><label class="fieldlabel">Составитель расписания<label><input type="password" name="password" placeholder="Введите пароль" required></label></label><button class="rolebtn" type="submit"><strong>Войти как составитель</strong><span>Полный доступ: классы, учителя, предметы, кабинеты, правила, AI и генерация.</span></button></form>
<form method="post"><input type="hidden" name="role" value="teacher"><label class="fieldlabel">Учитель<select name="teacher_name" required><option value="">Выберите себя</option>{% for t in teachers %}<option value="{{t}}">{{t}}</option>{% endfor %}</select></label><button class="rolebtn teacher" type="submit"><strong>Войти как учитель</strong><span>Ваши уроки на сегодня и просмотр расписания. Можно менять только кабинет своих уроков.</span></button></form>
<form method="post"><input type="hidden" name="role" value="student"><label class="fieldlabel">Ученик<select name="student_class" required><option value="">Выберите класс</option>{% for c in classes %}<option value="{{c}}">{{c}}</option>{% endfor %}</select></label><button class="rolebtn student" type="submit"><strong>Войти как ученик</strong><span>Только просмотр расписания своего класса. Никаких изменений.</span></button></form>
</div></div><p class="login-note">Данные общие для всей школы и сохраняются в центральной базе.</p></div></body></html>
